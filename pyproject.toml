[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "sinter"
dynamic = ["version"]
description = "A local-first community workbench: source-linked briefs, funding research and reviewable meeting transcription."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Lloyd Handyside" }]
keywords = ["neuroforge", "fracture", "erais", "ai", "code-review", "research", "chat"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Environment :: Web Environment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<9", "build>=1,<2", "ruff>=0.11,<1"]
browser = ["playwright>=1.50,<2"]
speech = ["faster-whisper>=1.1,<2"]

[project.scripts]
sinter = "sinter.cli:launch"

[project.urls]
Homepage = "https://github.com/neuroforge-io/Sinter"
Documentation = "https://neuroforge.io"

[tool.hatch.version]
path = "src/sinter/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sinter"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
