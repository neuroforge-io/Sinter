name: Source-backed research
description: Search-backed exploration; review every claim.
variables:
  - topic
steps:
  - name: Search and outline
    prompt: "Research {{topic}} using the supplied search excerpts. Cite URLs and flag missing evidence."
    use_search: true
    search_field: topic
    max_tokens: 512
  - name: Next steps
    prompt: "Based on the prior evidence and discussion, suggest next actions. Preserve uncertainty and references."
    stream: true
    max_tokens: 256
