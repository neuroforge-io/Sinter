name: Code review
description: Shared-context review; never invent test results.
variables:
  - code
  - language
steps:
  - name: Review
    prompt: "Review this {{language}} code. Distinguish suspected bugs from demonstrated ones: {{code}}"
    max_tokens: 512
  - name: Fixes
    prompt: "Suggest concrete fixes for the issues above. Do not claim tests were run."
    stream: true
    max_tokens: 512
