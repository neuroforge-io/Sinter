name: Native installers
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    name: ${{ matrix.os }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-2022, arch: x64, python_arch: x64, execution: native}
          - {os: windows-2022, arch: x86, python_arch: x86, execution: compatibility}
          - {os: windows-11-arm, arch: arm64, python_arch: arm64, execution: native}
          - {os: macos-15-intel, arch: x64, python_arch: x64, execution: native}
          - {os: macos-14, arch: arm64, python_arch: arm64, execution: native}
          - {os: ubuntu-22.04, arch: x64, python_arch: x64, execution: native}
          - {os: ubuntu-22.04-arm, arch: arm64, python_arch: arm64, execution: native}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          architecture: ${{ matrix.python_arch }}
      - run: python -m pip install pyinstaller==6.22.2 certifi
      - name: Ensure Windows installer compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe" -ErrorAction SilentlyContinue)) {
            choco install innosetup --yes --no-progress
          }
      - name: Build, install, exercise, and remove package
        run: python tools/package_native.py --arch ${{ matrix.arch }} --execution ${{ matrix.execution }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-${{ runner.os }}-${{ matrix.arch }}
          path: release/
          if-no-files-found: error
          retention-days: 14
  linux32:
    name: Linux 32-bit / ${{ matrix.arch }} (declared execution mode)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: x86, platform: linux/386, execution: compatibility}
          - {arch: armv7, platform: linux/arm/v7, execution: emulated}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
        if: matrix.arch == 'armv7'
        with:
          platforms: arm
      - name: Build and run in the target userspace
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
          TARGET_ARCH: ${{ matrix.arch }}
          EXECUTION_MODE: ${{ matrix.execution }}
        run: |
          docker run --rm --platform "$TARGET_PLATFORM" -e GITHUB_SHA -e TARGET_ARCH -e EXECUTION_MODE \
            -v "$PWD:/work" -w /work python:3.11-slim-bookworm sh -ec '
              apt-get update && apt-get install -y --no-install-recommends gcc libc6-dev zlib1g-dev binutils
              python -m pip install pyinstaller==6.22.2 certifi
              python tools/package_native.py --arch "$TARGET_ARCH" --execution "$EXECUTION_MODE"
            '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-Linux-${{ matrix.arch }}
          path: release/
          if-no-files-found: error
          retention-days: 14
