name: Native installers
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    name: ${{ matrix.os }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-2022, arch: x64, python_arch: x64, execution: native, accounts: true, account_args: ''}
          - {os: windows-2022, arch: x86, python_arch: x86, execution: compatibility, accounts: false, account_args: '--without-accounts'}
          - {os: windows-11-arm, arch: arm64, python_arch: arm64, execution: native, accounts: false, account_args: '--without-accounts'}
          - {os: macos-15-intel, arch: x64, python_arch: x64, execution: native, accounts: false, account_args: '--without-accounts'}
          - {os: macos-14, arch: arm64, python_arch: arm64, execution: native, accounts: true, account_args: ''}
          - {os: ubuntu-22.04, arch: x64, python_arch: x64, execution: native, accounts: true, account_args: ''}
          - {os: ubuntu-22.04-arm, arch: arm64, python_arch: arm64, execution: native, accounts: true, account_args: ''}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          architecture: ${{ matrix.python_arch }}
      - run: python -m pip install pyinstaller==6.22.2 certifi
      - name: Install supported account verification runtime
        if: matrix.accounts
        run: python -m pip install '.[accounts]'
      - name: Ensure Windows installer compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe" -ErrorAction SilentlyContinue)) {
            choco install innosetup --yes --no-progress
          }
      - name: Build, install, exercise, and remove package
        run: python tools/package_native.py --arch ${{ matrix.arch }} --execution ${{ matrix.execution }} ${{ matrix.account_args }}
      - name: Qualify the frozen Linux native window
        if: runner.os == 'Linux' && matrix.arch == 'x64'
        timeout-minutes: 2
        run: |
          if ! command -v xvfb-run >/dev/null; then
            python tools/native_window_smoke.py --binary dist/Sinter/Sinter --receipt release/frozen-native-window.json
            exit 1
          fi
          xvfb-run --auto-servernum --server-args="-screen 0 1440x1000x24 -nolisten tcp" \
            python tools/native_window_smoke.py --binary dist/Sinter/Sinter --receipt release/frozen-native-window.json
      - name: Retain frozen native-window evidence
        if: always() && runner.os == 'Linux' && matrix.arch == 'x64'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frozen-native-window-Linux-x64
          path: release/frozen-native-window.json
          if-no-files-found: warn
          retention-days: 14
      - name: Prepare installed Linux first-run browser tooling
        if: runner.os == 'Linux' && matrix.arch == 'x64'
        run: |
          python -m pip install '.[browser]'
          python -m playwright install --with-deps chromium
      - name: Qualify the actual installed Linux menu command
        if: runner.os == 'Linux' && matrix.arch == 'x64'
        timeout-minutes: 4
        run: |
          PACKAGE_PREFIX="Sinter-$(PYTHONPATH=src python -c 'from sinter import __version__; print(__version__)')-linux-x64"
          trap 'sudo dpkg -r sinter' EXIT
          sudo dpkg -i "release/$PACKAGE_PREFIX.deb"
          python tools/installed_menu_browser.py --installer "release/$PACKAGE_PREFIX.deb" \
            --package-receipt "release/$PACKAGE_PREFIX-test.json" --source-commit "$GITHUB_SHA" \
            --receipt first-run/installed-menu.json
          sudo dpkg -r sinter
          trap - EXIT
          python -c 'import json; from pathlib import Path; p=Path("first-run/installed-menu.json"); d=json.loads(p.read_bytes()); d["package_removed"]=not Path("/opt/neuroforge/sinter/Sinter").exists() and not Path("/usr/share/applications/sinter.desktop").exists() and not Path("/usr/share/applications/sinter-native.desktop").exists(); d["passed"]=d.get("workflow_passed") is True and d["package_removed"]; p.write_text(json.dumps(d,indent=2)+"\n"); assert d["passed"]'
      - name: Retain installed Linux first-run evidence
        if: always() && runner.os == 'Linux' && matrix.arch == 'x64'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: installed-menu-Linux-x64
          path: first-run/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-${{ runner.os }}-${{ matrix.arch }}
          path: release/
          if-no-files-found: error
          retention-days: 14
  installed_rc3:
    name: Linux x64 / offline installed RC3 gates
    needs: desktop
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.head_ref == 'qualification/linux-rc3-20261001' ||
       github.head_ref == 'qualification/linux-rc3-final-20261001' ||
       github.head_ref == 'qualification/linux-rc3-caller-fix-20261001')
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-Linux-x64
          path: candidate
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install '.[browser]'
      - run: python -m playwright install --with-deps chromium
      - name: Bind source and portable core to the same tested commit
        run: |
          git archive --format=zip --output=candidate/sinter-0.5.4rc3-source.zip "$GITHUB_SHA"
          python tools/build_zipapp.py
          cp dist/sinter.pyz candidate/sinter-0.5.4rc3.pyz
      - name: Fetch immutable public prior assets without authentication
        run: python -B tools/qualify_linux_preview.py fetch --output priors
      - name: Prepare tooling image before disabling application-test networking
        run: |
          mkdir -p installed-qualification-setup
          docker build --tag sinter-candidate-qualification:ubuntu2204 \
            --file tools/qualification-image.Dockerfile tools \
            > installed-qualification-setup/image-build.log 2>&1
          docker image inspect sinter-candidate-qualification:ubuntu2204 \
            > installed-qualification-setup/image.json
      - name: Run existing pinned upgrades and installed workflow/recovery
        run: |
          python -B tools/qualify_linux_preview.py run --candidate candidate \
            --priors priors --output installed-qualification \
            --source-commit "$GITHUB_SHA" \
            --image sinter-candidate-qualification:ubuntu2204
      - name: Retain observed gates, including partial failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-rc3-installed-gates
          path: |
            candidate/
            installed-qualification/
            installed-qualification-setup/
            priors/*/source-verification.json
            priors/*/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
  linux32:
    name: Linux 32-bit / ${{ matrix.arch }} (CLI/browser-only)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: x86, platform: linux/386, execution: compatibility, image: 'python:3.11-slim-trixie', compiler: 'cargo rustc'}
          - {arch: armv7, platform: linux/arm/v7, execution: emulated, image: 'python:3.11-slim-bookworm', compiler: ''}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
        if: matrix.arch == 'armv7'
        with:
          platforms: arm
      - name: Build and run in the target userspace
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
          TARGET_ARCH: ${{ matrix.arch }}
          EXECUTION_MODE: ${{ matrix.execution }}
          PYTHON_IMAGE: ${{ matrix.image }}
          CRYPTO_COMPILER: ${{ matrix.compiler }}
        run: |
          docker run --rm --platform "$TARGET_PLATFORM" -e GITHUB_SHA -e TARGET_ARCH -e EXECUTION_MODE -e CRYPTO_COMPILER \
            -v "$PWD:/work" -w /work "$PYTHON_IMAGE" sh -ec '
              apt-get update && apt-get install -y --no-install-recommends gcc libc6-dev zlib1g-dev binutils libssl-dev libffi-dev pkg-config $CRYPTO_COMPILER
              python -m pip install pyinstaller==6.22.2 certifi
              python -m pip install ".[accounts]"
              python tools/package_native.py --arch "$TARGET_ARCH" --execution "$EXECUTION_MODE" --without-native-window
            '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-Linux-${{ matrix.arch }}
          path: release/
          if-no-files-found: error
          retention-days: 14
