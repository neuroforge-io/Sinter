name: Validate Sinter browser serving budget
on:
  push:
    branches: [fix/reliability-budgets-20260911]
    paths: [.github/workflows/reliability-browser-once.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Fix the independent browser cutoff and exercise the real module
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/sinter/web/api.js');s=p.read_text();old='const timer = setTimeout(abort, 150000);';assert s.count(old)==1
          s=s.replace(old,'// Allow the 660-second Python stream budget plus one idle-read and delivery margin.\n  const timer = setTimeout(abort, 700000);');p.write_text(s)
          p=Path('docs/serving-reliability.md');s=p.read_text();s+='\nThe browser stream budget is 700 seconds, above the Python 660-second budget plus its final bounded socket read. Ordinary local JSON/job-status calls remain 35 seconds; polling waits for each completed status request rather than holding a single long HTTP request. Browser cancellation remains effective and no generation retry is added.\n';p.write_text(s)
          Path('tests/reliability_browser.mjs').write_text('''import test from 'node:test';
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {setImmediate as nextTurn} from 'node:timers/promises';
          const source=readFileSync(new URL('../src/sinter/web/api.js',import.meta.url),'utf8');
          let serial=0;
          async function fixture(t){
            const api=await import('data:text/javascript;base64,'+Buffer.from(source+'\\n// instance '+(++serial)).toString('base64'));
            let now=0,id=0,upstream,signal,calls=0;const timers=new Map();
            t.mock.method(globalThis,'setTimeout',(fn,ms)=>{const key=++id;timers.set(key,{at:now+ms,fn});return key;});
            t.mock.method(globalThis,'clearTimeout',key=>timers.delete(key));
            t.mock.method(globalThis,'fetch',async(path,options)=>{
              calls++;if(path==='/api/session')return Response.json({token:'local-test-token'});
              assert.equal(path,'/api/chat');assert.equal(options.headers['X-Sinter-Token'],'local-test-token');signal=options.signal;
              return new Response(new ReadableStream({start(c){upstream=c;signal.addEventListener('abort',()=>c.error(new DOMException('Aborted','AbortError')),{once:true});}}));
            });
            const events=[],controller=new AbortController();
            const pending=api.stream('/api/chat',{},event=>events.push(event),controller.signal);
            await nextTurn();await nextTurn();
            return {pending,events,controller,get signal(){return signal;},get calls(){return calls;},
              tick(ms){now+=ms;for(const [key,timer] of [...timers])if(timer.at<=now){timers.delete(key);timer.fn();}},
              complete(){upstream.enqueue(new TextEncoder().encode('data: {"type":"delta","text":"Hello"}\\n\\ndata: [DONE]\\n\\n'));upstream.close();}};
          }
          test('browser survives the former 150-second timeout and completes once',async t=>{
            const f=await fixture(t);f.tick(150001);assert.equal(f.signal.aborted,false);f.complete();await f.pending;
            assert.deepEqual(f.events,[{type:'delta',text:'Hello'}]);assert.equal(f.calls,2);
          });
          test('browser retains an absolute 700-second ceiling',async t=>{
            const f=await fixture(t);f.tick(699999);assert.equal(f.signal.aborted,false);
            const rejected=assert.rejects(f.pending,{name:'AbortError'});f.tick(2);await rejected;assert.equal(f.signal.aborted,true);
          });
          test('human cancellation still aborts the stream without retrying it',async t=>{
            const f=await fixture(t);const rejected=assert.rejects(f.pending,{name:'AbortError'});f.controller.abort();await rejected;
            assert.equal(f.signal.aborted,true);assert.equal(f.calls,2);
          });
          ''')
          Path('tests/test_reliability_browser.py').write_text('''"""Execute the browser module rather than only comparing timeout literals."""
          import shutil
          import subprocess
          from pathlib import Path
          import pytest
          
          def test_browser_reliability_contract():
              node=shutil.which('node')
              if node is None:
                  pytest.skip('Node is required to execute the browser module')
              root=Path(__file__).resolve().parents[1]
              result=subprocess.run([node,'--test','tests/reliability_browser.mjs'],cwd=root,capture_output=True,text=True,timeout=20)
              assert result.returncode==0,result.stdout+result.stderr
          ''')
          PY
      - name: Full Python and executed browser regressions plus package build
        run: |
          command -v node
          mkdir -p /tmp/sinter-browser
          node --test tests/reliability_browser.mjs | tee /tmp/sinter-browser/browser-tests.log
          python -m pytest -q --junitxml=/tmp/sinter-browser/tests.xml
          python -m build --outdir /tmp/sinter-browser/dist
      - name: Commit tested browser correction to review branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/reliability-browser-once.yml
          git add src/sinter/web/api.js docs/serving-reliability.md tests/reliability_browser.mjs tests/test_reliability_browser.py
          git commit -m 'Keep browser streams alive through the backend budget while preserving cancel'
          git config --local credential.helper '!gh auth git-credential'
          git push origin HEAD:refs/heads/fix/reliability-budgets-20260911
          git rev-parse HEAD > /tmp/sinter-browser/commit.txt
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: sinter-browser-reliability-validation
          path: /tmp/sinter-browser/
          retention-days: 3
