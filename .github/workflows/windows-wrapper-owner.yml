name: Windows wrapper ownership
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Start-Sinter.bat'
      - 'tests/test_review_recovery.py'
      - 'tests/test_wrapper_fixture_lanes.py'
      - 'tests/wrapper_diagnostics.py'
      - 'tests/test_windows_wrapper_profile.py'
      - 'tests/fixtures/start_sinter_b269.bat'
      - 'tests/windows_process_owner.py'
      - 'tests/test_windows_process_owner.py'
      - '.github/workflows/windows-wrapper-owner.yml'
permissions:
  contents: read
concurrency:
  group: windows-wrapper-owner-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ownership:
    name: Owned Windows processes / Python ${{ matrix.python }}
    runs-on: windows-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[dev]'
      - name: Retain exact source and interpreter identity
        shell: python
        run: |
          import hashlib, json, os, platform, subprocess, sys
          from pathlib import Path
          output = Path("test-results/ownership")
          output.mkdir(parents=True, exist_ok=False)
          paths = ["Start-Sinter.bat", "tests/windows_process_owner.py",
                   "tests/test_windows_process_owner.py", "tests/wrapper_diagnostics.py",
                   "tests/test_review_recovery.py", "tests/test_wrapper_fixture_lanes.py",
                   "tests/test_windows_wrapper_profile.py", "tests/fixtures/start_sinter_b269.bat",
                   ".github/workflows/windows-wrapper-owner.yml"]
          receipt = {"source": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
                     "expected_source": os.environ["GITHUB_SHA"], "python": sys.version,
                     "executable": sys.executable, "platform": platform.platform(),
                     "files": {p: hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths},
                     "git_files": {p: hashlib.sha256(subprocess.check_output(
                         ["git", "show", "HEAD:" + p])).hexdigest() for p in paths}}
          assert receipt["source"] == receipt["expected_source"]
          (output / "source.json").write_text(json.dumps(receipt, indent=2), encoding="utf-8")
      - name: Qualify atomic ownership and bounded interruption cleanup
        run: python -m pytest -q -x tests/test_windows_process_owner.py --junitxml=test-results/ownership.xml
        env:
          SINTER_STARTUP_DIAGNOSTICS_DIR: test-results/ownership
          SINTER_WINDOWS_OWNER_CONTROLS: '1'
      - name: Compare frozen and candidate wrappers with unchanged readiness checks
        run: python -m pytest -q -x tests/test_windows_wrapper_profile.py --junitxml=test-results/launcher-profile.xml
        env:
          SINTER_STARTUP_DIAGNOSTICS_DIR: test-results/ownership
          SINTER_WINDOWS_WRAPPER_PROFILE: '1'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-wrapper-ownership-${{ matrix.python }}
          path: test-results/
          retention-days: 14
