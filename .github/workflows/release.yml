name: Publish tested community release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sinter-release
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(PYTHONPATH=src python -c 'from sinter import __version__; print(__version__)')
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi
  quality:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    uses: ./.github/workflows/ci.yml
  native:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    uses: ./.github/workflows/native.yml
  publish:
    needs: [plan, quality, native]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: native-*
          path: publish
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sinter-verified-package
          path: source-package
      - name: Verify receipts and assemble release
        run: python tools/release_manifest.py publish source-package
      - name: Publish preview without overwriting an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" publish/* --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "Sinter $RELEASE_TAG - Community desktop preview" \
            --prerelease --notes-file docs/RELEASE_NOTES.md
