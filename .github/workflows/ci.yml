name: Sinter quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sinter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[dev]'
      # Gate correctness errors now; broad style cleanup is a separate change.
      - run: python -m ruff check --select E9,F63,F7,F82 src tests tools
      - run: python -m pytest -q --junitxml=test-results/results.xml
      - run: python tools/check_public_boundary.py
      - run: python tools/self_audit.py
      - run: python -m sinter --version
      - run: python tools/build_zipapp.py
      - run: python dist/sinter.pyz --version
      - run: python -m build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tests-${{ matrix.os }}-${{ matrix.python }}
          path: test-results/
          retention-days: 14
  browser:
    name: Chromium workflows
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install '.[browser]'
      - run: python -m playwright install --with-deps chromium
      - run: python tools/browser_smoke.py
      - run: python tools/studio_browser.py
      - run: python tools/desktop_browser.py
      - run: python tools/site_browser.py
      - run: python tools/casebook_browser.py
      - run: python tools/quality_browser.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: browser-screenshots
          path: browser-artifacts/
          retention-days: 14
  speech:
    name: Local speech / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install '.[speech]'
      - run: python tools/speech_smoke.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: speech-${{ matrix.os }}
          path: speech-artifacts/
          retention-days: 14
  source:
    name: Verified source and portable app
    needs: [tests, browser, speech, rkc]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python tools/build_zipapp.py
      - run: git archive --format=zip --output=sinter-source.zip HEAD
      - run: git rev-parse HEAD > verified-commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sinter-verified-package
          path: |
            sinter-source.zip
            dist/sinter.pyz
            verified-commit.txt
          retention-days: 14
  rkc:
    name: Actual RKC interoperability
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: neuroforge-io/RKC
          ref: 37a908e9f99cc246d8185bdc202981c0b55e9ef5
          path: .rkc-upstream
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.5'
          cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: go build -o "$RUNNER_TEMP/rkc" ./cmd/rkc
        working-directory: .rkc-upstream
      - run: python tools/rkc_smoke.py "$RUNNER_TEMP/rkc"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rkc-compatibility
          path: rkc-artifacts/
          retention-days: 14
