name: Sinter quality
on:
  push:
    branches: [main, 'upgrade/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sinter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package and test dependencies
        run: python -m pip install '.[dev]'
      - name: Regression tests
        run: python -m pytest -q --junitxml=test-results/results.xml
      - name: Public boundary
        run: python tools/check_public_boundary.py
      - name: Installed wheel entry point
        run: python -m sinter --version
      - name: Portable build
        run: python tools/build_zipapp.py
      - name: Portable entry point
        run: python dist/sinter.pyz --version
      - name: Build wheel and source distribution
        run: python -m build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: tests-${{ matrix.os }}-${{ matrix.python }}
          path: test-results/
          retention-days: 14
  browser:
    name: Chromium workflows
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install '.[browser]'
      - run: python -m playwright install --with-deps chromium
      - run: python tools/browser_smoke.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-screenshots
          path: browser-artifacts/
          retention-days: 14
  source:
    name: Verified source and portable app
    needs: [tests, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python tools/build_zipapp.py
      - run: git archive --format=zip --output=sinter-source.zip HEAD
      - run: git rev-parse HEAD > verified-commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sinter-verified-package
          path: |
            sinter-source.zip
            dist/sinter.pyz
            verified-commit.txt
          retention-days: 14
