name: Source snapshot
on:
  push:
    branches: ['upgrade/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: git archive --format=zip --output=source-snapshot.zip HEAD
      - run: git rev-parse HEAD > source-commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-snapshot-not-a-release
          path: |
            source-snapshot.zip
            source-commit.txt
          retention-days: 7
