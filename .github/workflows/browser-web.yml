name: Browser WebAssembly workbench
on:
  push:
    branches: [main]
    paths: ['browser/**', 'src/**', 'tests/test_browser_runtime.py', '.github/workflows/browser-web.yml']
  pull_request:
    paths: ['browser/**', 'src/**', 'tests/test_browser_runtime.py', '.github/workflows/browser-web.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install '.[dev,browser]'
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - run: python -m pytest -q tests/test_browser_runtime.py tests/test_document_copies.py tests/test_search_chat.py
      - run: python browser/build.py dist/browser/sinter
      - run: |
          python -m http.server 8877 --bind 127.0.0.1 --directory dist/browser > /tmp/sinter-http.log 2>&1 &
          python browser/smoke.py --browser ${{ matrix.browser }} --output browser-evidence
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: browser-${{ matrix.browser }}-${{ github.sha }}
          path: browser-evidence
